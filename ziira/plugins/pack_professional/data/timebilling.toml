# ----------------------------------------------------------------------------------------- standard invoice wording
[[snippet]]
name = "Thank you and payment"
language = "en"
body = "Thank you for your business. Please pay by the due date shown on this invoice."
[[snippet]]
name = "Thank you and payment"
language = "sw"
body = "Asante kwa kuamini huduma zetu. Tafadhali lipa kufikia tarehe ya mwisho iliyoonyeshwa kwenye ankara hii."

[[snippet]]
name = "Time and disbursements attached"
language = "en"
body = "A schedule of the time spent and the disbursements is attached to this invoice."
[[snippet]]
name = "Time and disbursements attached"
language = "sw"
body = "Orodha ya muda uliotumika na gharama zilizolipwa imeambatishwa kwenye ankara hii."

[[snippet]]
name = "Fixed fee milestone"
language = "en"
body = "This invoice is for the agreed fixed-fee milestone set out in our engagement letter."
[[snippet]]
name = "Fixed fee milestone"
language = "sw"
body = "Ankara hii ni ya hatua ya ada maalum iliyokubaliwa kwenye barua yetu ya makubaliano."

[[snippet]]
name = "Monthly retainer"
language = "en"
body = "Monthly retainer for the period shown. Work beyond the retainer is billed separately at the agreed rates."
[[snippet]]
name = "Monthly retainer"
language = "sw"
body = "Ada ya kila mwezi kwa kipindi kilichoonyeshwa. Kazi inayozidi makubaliano hutozwa tofauti kwa viwango vilivyokubaliwa."

[[snippet]]
name = "Disbursements at cost"
language = "en"
body = "Disbursements are charged as paid, with the handling charge agreed with you. Receipts are available on request."
[[snippet]]
name = "Disbursements at cost"
language = "sw"
body = "Gharama zilizolipwa zinatozwa kama zilivyolipwa, pamoja na ada ya usimamizi iliyokubaliwa nawe. Risiti zinapatikana ukiomba."

[[snippet]]
name = "Fee cap applied"
language = "en"
body = "Our fee for this matter is capped as agreed; time above the cap has not been charged."
[[snippet]]
name = "Fee cap applied"
language = "sw"
body = "Ada yetu kwa jambo hili ina kikomo kama tulivyokubaliana; muda unaozidi kikomo haujatozwa."

# ----------------------------------------------------------------------------------- Intelligence limits for a practice
[intel."timebilling.unbilled_ageing"]
unbilled_days = 21
[intel."timebilling.approval_waiting"]
approval_days = 2
[intel."timebilling.timesheets_not_submitted"]
grace_days = 2
[intel."timebilling.retainer_nearly_used"]
used_percent = 80
[intel."timebilling.realisation_low"]
min_percent = 85


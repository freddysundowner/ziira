# What Time and Billing starts with for a practice that bills time. Everything here is a starting point the
# business edits; nothing is a rule. See docs/pack_professional.md.

[settings]
service_sku = "PRO-CONSULT"        # what invoices are made under, until a project names its own service item
expense_sku = "PRO-DISB"           # what re-billed costs are invoiced under
minute_step = 5
approval_required = true
default_group_by = "project"
budget_alert_percent = 80
unsubmitted_after_days = 3
unbilled_after_days = 21
nudge_minutes = 360                # a working day with less than 6 hours logged is reminded the next morning
nudge_hour = 9
approval_reminder_days = 2
approval_escalate_days = 5

# ----------------------------------------------------------------------------------------------- engagement templates
[[template]]
name = "Monthly bookkeeping"
description = "Books kept and reconciled every month for a fixed monthly fee. Add the fee on the project's retainer."
billing_mode = "retainer"
budget_hours = 8
frequency = "monthly"
due_day = 15
lead_days = 10
checklist = [
  "Collect bank statements and receipts",
  "Post transactions and reconcile bank and mobile-money accounts",
  "Check what customers owe and what is owed to suppliers",
  "Prepare the monthly summary",
  "Send it to the client and note their questions",
]

[[template]]
name = "Annual accounts and tax return"
description = "Year-end accounts and the tax return for a fixed fee, billed in three steps. Set the due date that applies to your client."
billing_mode = "fixed_fee"
frequency = "annual"
due_day = 30
due_month = 6
lead_days = 45
checklist = [
  "Engagement letter signed",
  "Year-end records received from the client",
  "Trial balance prepared",
  "Accounts drafted",
  "Partner review",
  "Client approves the accounts",
  "Return filed and confirmation saved",
]
[[template.milestone]]
name = "Records received and work started"
percent = 30
[[template.milestone]]
name = "Draft accounts delivered"
percent = 40
[[template.milestone]]
name = "Filed and handed over"
percent = 30

[[template]]
name = "Audit"
description = "An audit billed by the hour but capped; set the cap on the project. Repeats every year."
billing_mode = "capped_fee"
budget_hours = 120
frequency = "annual"
due_day = 31
due_month = 12
lead_days = 60
checklist = [
  "Engagement letter and independence check",
  "Planning and risk assessment",
  "Fieldwork",
  "Partner review",
  "Management letter sent",
  "Sign-off",
]

[[template]]
name = "Monthly payroll service"
description = "Payroll run for a client every month."
billing_mode = "retainer"
budget_hours = 4
frequency = "monthly"
due_day = 25
lead_days = 7
checklist = [
  "Receive changes and time off from the client",
  "Run the payroll",
  "Client approves the payroll",
  "Pay and file what is due",
  "Send payslips",
]

[[template]]
name = "Legal matter (by the hour)"
description = "A matter billed on time spent, with a budget to warn at."
billing_mode = "time_and_materials"
budget_hours = 40
checklist = [
  "Conflict check done",
  "Engagement letter signed",
  "Fee estimate sent to the client",
  "Client documents received",
]

[[template]]
name = "Legal matter (capped fee)"
description = "Time is recorded and billed at the rates, but never more than the cap on the project."
billing_mode = "capped_fee"
budget_hours = 30
checklist = [
  "Conflict check done",
  "Engagement letter signed with the cap stated",
  "Client documents received",
]

[[template]]
name = "Consulting project (fixed fee)"
description = "A defined piece of work for a fixed fee, billed at three milestones."
billing_mode = "fixed_fee"
checklist = [
  "Scope and fee agreed in writing",
  "Kick-off meeting held",
  "Weekly update sent",
  "Final report delivered",
]
[[template.milestone]]
name = "Kick-off"
percent = 30
[[template.milestone]]
name = "Draft delivered"
percent = 40
[[template.milestone]]
name = "Final delivery"
percent = 30

[[template]]
name = "Agency retainer (monthly)"
description = "A monthly fee for an agreed amount of work; extra hours are billed separately."
billing_mode = "retainer"
budget_hours = 30
frequency = "monthly"
due_day = 5
lead_days = 7
checklist = [
  "Plan for the month agreed",
  "Deliverables shipped",
  "Monthly report sent to the client",
]

[[template]]
name = "Campaign or website project"
description = "Creative project with a budget of hours, billed by time."
billing_mode = "time_and_materials"
budget_hours = 60
checklist = [
  "Brief agreed",
  "First concepts presented",
  "Revisions round done",
  "Delivered and signed off",
]


# Example data for a clinic or dental practice: appointments and billing only. Every price is an EXAMPLE until the business sets its own.
[settings]
cancel_window_hours = 24
reminder_hours_before = 24
default_buffer_minutes = 5
waitlist_confirm_minutes = 30
late_cancel_fee_percent = 0
no_show_fee_percent = 0
rebook_prompt_hours = 2
recalls_enabled = true
reminder_template = "appointment_reminder_clinic"
recall_template = "appointment_recall_clinic"
rebook_template = "appointment_rebook_clinic"

[[resource]]
name = "Practitioner 1"
kind = "staff"
level = "Senior"
colour = "#16a085"
order = 1
hours = [{ days = [0, 1, 2, 3, 4], start = "08:00", end = "17:00" }, { days = [5], start = "08:00", end = "13:00" }]

[[resource]]
name = "Practitioner 2"
kind = "staff"
colour = "#2980b9"
order = 2
hours = [{ days = [0, 1, 2, 3, 4], start = "08:00", end = "17:00" }]

[[resource]]
name = "Consulting room 1"
kind = "room"
colour = "#7f8c8d"
order = 3
hours = [{ days = [0, 1, 2, 3, 4], start = "08:00", end = "17:00" }]


[[service]]
sku = "CLI-CONSULT-NEW"
name = "Consultation (new patient)"
minutes = 30
price = 1500
recall_days = 180

[[service]]
sku = "CLI-CONSULT-FU"
name = "Consultation (follow-up)"
minutes = 20
price = 1000

[[service]]
sku = "CLI-DENTAL-CHECK"
name = "Dental check-up"
minutes = 30
price = 1500
recall_days = 180

[[service]]
sku = "CLI-SCALE"
name = "Scale and polish"
minutes = 45
price = 2500
recall_days = 180

[[service]]
sku = "CLI-FILLING"
name = "Filling"
minutes = 45
price = 3500
deposit_percent = 20

[[service]]
sku = "CLI-EXTRACT"
name = "Extraction"
minutes = 30
price = 3000

[[service]]
sku = "CLI-PHYSIO"
name = "Physiotherapy session"
minutes = 45
price = 2000
recall_days = 14

[[service]]
sku = "CLI-REVIEW"
name = "Review visit"
minutes = 15
price = 800

[[step]]
id = "prices"
title = "Set your own prices"
hint = "The prices shown as examples are not yours yet: open Services offered and change each one."
to = "/services/services"
check = "prices_set"

[[step]]
id = "staff"
title = "Name your practitioners and rooms"
hint = "Replace the example practitioners and room with your own, and set their hours."
to = "/services/resources"
check = "staff_named"

[[step]]
id = "link"
title = "Link each service to its service item"
hint = "So a finished visit can be billed."
to = "/services/services"
check = "services_linked"

[[step]]
id = "page"
title = "Switch on your booking page"
hint = "Let patients book appointments themselves."
to = "/services/settings"
check = "booking_page"

[[step]]
id = "booking"
title = "Take your first appointment"
hint = "Put an appointment in the calendar."
to = "/services/calendar"
check = "first_booking"

[[step]]
id = "checkout"
title = "Check out your first patient"
hint = "Bill a visit, with the insurer's share and the patient's co-pay if there is one."
to = "/services/front-desk"
check = "first_checkout"

[intel."bookings.no_show_rate"]
lookback_days = 30
min_appointments = 10
no_show_percent = "12.0"

[intel."bookings.low_utilisation"]
lookback_days = 14
utilisation_percent = "50.0"
min_hours = 16


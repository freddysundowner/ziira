kind = "tax"
order = 30
base = "taxable"
applies_to = "resident"
[table.definition.employee]
method = "bands"
credit = "2400"
[[table.definition.employee.bands]]
up_to = "24000"
rate = "0.10"
[[table.definition.employee.bands]]
up_to = "32333"
rate = "0.25"
[[table.definition.employee.bands]]
up_to = "500000"
rate = "0.30"
[[table.definition.employee.bands]]
up_to = "800000"
rate = "0.325"
[[table.definition.employee.bands]]
rate = "0.35"

# Additions to the general chart of accounts for a Kenyan retail business. An account with a code the general chart has
# takes this name for a NEW company's books; a new code is added to existing books too (nothing is renamed or removed in
# books that already exist). It is a starting point: the owner edits it with their accountant.

[[account]]
code = "1030"
name = "M-Pesa clearing"
type = "asset"
subtype = "mobile_money_clearing"
is_control = true

[[account]]

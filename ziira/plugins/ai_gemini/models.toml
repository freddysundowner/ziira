# Google Gemini: what the Super Admin offers. Ids and prices change often: this is a recommendation, not the truth.
# The live list (Refresh models) and the operator's price overrides come first. USD per million tokens (paid tier, text).
[provider]
title = "Google Gemini"
capabilities = ["tool_calling", "system_prompt", "json_output"]
base_url = "https://generativelanguage.googleapis.com"
auth = "x-goog-api-key header"
terms_url = "https://ai.google.dev/gemini-api/terms"
docs_url = "https://ai.google.dev/gemini-api/docs/models"
verified_on = "2026-10-16"
prices_updated = "2026-10-16"
price_source = "https://ai.google.dev/gemini-api/docs/pricing"
live_prefixes = ["gemini-"]

[defaults]
explain = "gemini-2.5-flash"
rank = "gemini-2.5-flash"
ask = "gemini-3.8-flash"

[[models]]
id = "gemini-3.8-flash"
title = "Gemini 3.8 Flash"
tiers = ["best_value"]
input_per_mtok = "0.75"
output_per_mtok = "3.75"
notes = "Current Flash. The price page lists a rise to 1.50 / 7.50 from 1 January 2027: update the price then."

[[models]]
id = "gemini-2.5-flash"
title = "Gemini 2.5 Flash"
tiers = ["cheapest"]
input_per_mtok = "0.30"
output_per_mtok = "2.50"
notes = "Older Flash, cheaper; good for the short explanations and rankings. Check its retirement date."

[[models]]
id = "gemini-2.5-flash-lite"
title = "Gemini 2.5 Flash-Lite"
input_per_mtok = "0.10"
output_per_mtok = "0.40"
notes = "Lowest price, but weaker at multi-step tool use and Swahili: not recommended for Ask Ziira."

[[models]]
id = "gemini-3.1-pro-preview"
title = "Gemini 3.1 Pro (preview)"
tiers = ["higher_quality"]
input_per_mtok = "2.00"
output_per_mtok = "12.00"
notes = "Preview model; prices double above 200,000 tokens of prompt."

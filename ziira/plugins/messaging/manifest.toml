[unit]
name = "messaging"
title = "Messaging channels (email, SMS)"
description = "Send email and SMS to customers and staff through your own channel."
kind = "plugin"
version = "1.0.0"
sdk = ">=1.0,<2.0"
requires = []

[provides]
api_prefix = "/api/v1/plugins/messaging"

# Sockets of other units this plugin plugs into (code in hooks.py)
[extends]
implements = ["kernel.notification_channel"]

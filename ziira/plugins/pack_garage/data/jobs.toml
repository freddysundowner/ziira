# What a workshop starts with. Everything here is an example the business edits: standard times differ by make and
# workshop, and no price is given (a rate is the business's own).

[settings]
default_warranty_days = 30
estimate_valid_days = 14
unapproved_work = "warn"        # work beyond what the customer approved: off, warn or block
release_unpaid = "warn"         # handing a vehicle back before it is paid for
required_photos = "warn"
odometer_unit = "km"
labour_sku = "GAR-LABOUR"
parts_sku = "GAR-PARTS"
fees_sku = "GAR-FEES"

# --------------------------------------------------------------------------- stages (added to the usual ones)
[[status]]
code = "waiting_for_insurer"
name = "Waiting for insurer"
kind = "waiting"

[[status]]
code = "waiting_for_customer"
name = "Waiting for customer"
kind = "waiting"

[[status]]
code = "quality_check"
name = "Quality check"
kind = "open"

[[move]]
from = "diagnosing"
to = "waiting_for_insurer"
[[move]]
from = "quoted"
to = "waiting_for_insurer"
[[move]]
from = "waiting_for_insurer"
to = "approved"
[[move]]
from = "waiting_for_insurer"
to = "in_progress"
[[move]]
from = "waiting_for_insurer"
to = "diagnosing"
[[move]]
from = "waiting_for_insurer"
to = "cancelled"
[[move]]
from = "diagnosing"
to = "waiting_for_customer"
[[move]]
from = "in_progress"
to = "waiting_for_customer"
[[move]]
from = "waiting_for_customer"
to = "in_progress"
[[move]]
from = "waiting_for_customer"
to = "diagnosing"
[[move]]
from = "waiting_for_customer"
to = "cancelled"
[[move]]
from = "in_progress"
to = "quality_check"
[[move]]
from = "waiting_for_parts"
to = "quality_check"
[[move]]
from = "quality_check"
to = "ready"
[[move]]
from = "quality_check"
to = "in_progress"

# --------------------------------------------------------------------------- intake checklists
[[checklist]]
name = "Vehicle intake"
asset_kind = "vehicle"
items = ["Fuel level noted", "Odometer read", "Warning lights noted", "Spare wheel, jack and tools present",
         "Belongings removed or listed", "Walk-around photos taken", "Key tagged", "Customer signed the drop-off"]

[[checklist]]
name = "Body repair intake"
asset_kind = "vehicle"
items = ["Existing damage photographed from all sides", "Odometer and fuel gauge photographed", "Belongings removed or listed",
         "Wheel nuts and spare checked", "Key tagged", "Customer signed the drop-off"]

[[checklist]]
name = "Insurer job"
asset_kind = "vehicle"
items = ["Policy and claim numbers recorded", "Assessor name and phone recorded", "Excess explained to the customer",
         "Photos for the assessor taken", "Authority to repair received before work starts",
         "Old parts kept for the assessor", "Re-inspection date noted"]

[[checklist]]
name = "Phone or device intake"
asset_kind = "device"
items = ["IMEI or serial number recorded", "Damage and liquid indicators noted", "SIM and memory card removed",
         "Customer told to back up their data", "Accessories listed"]

[[checklist]]
name = "Garment intake"
asset_kind = "garment"
items = ["Garment tagged", "Measurements taken or checked", "Fabric, lining and trims noted", "Fitting date set",
         "Pickup date agreed", "Deposit taken"]


# --------------------------------------------------------------------------- first-run checklist
[[step]]
id = "items"
title = "Choose the labour, parts and fees items"
hint = "Jobs invoices all labour, parts and charges under these three service items; their tax codes are the job's tax."
to = "/jobs/settings"
check = "items_chosen"
[[step]]
id = "rates"
title = "Set your hourly labour rate"
hint = "Then give each kind of work (mechanical, body, paint, electrical) its own rate if it differs."
to = "/jobs/settings"
check = "rates_set"
[[step]]
id = "tasks"
title = "Check the standard times"
hint = "The times in the task library are examples. Edit them for your workshop, or switch off the ones you do not do."
to = "/jobs/settings"
check = "tasks_reviewed"
[[step]]
id = "reminders"
title = "Switch on service reminders"
hint = "Customers are reminded before their next service is due, by the message channel you have set up."
to = "/jobs/settings"
check = "reminders"
[[step]]
id = "job"
title = "Take in your first vehicle"
to = "/jobs/new"
check = "first_job"
[[step]]
id = "estimate"
title = "Send your first estimate"
to = "/jobs"
check = "first_estimate"
[[step]]
id = "insurers"
title = "Add the insurers you work with"
hint = "Their labour rates and parts rules apply by themselves on their jobs. Skip this if you do not do insurance work."
to = "/claims/payers"

# --------------------------------------------------------------------------- Intelligence: limits that suit a workshop
[intel."jobs.stuck_in_stage"]
open_days = 4
waiting_days = 7
serious_days = 21

[intel."jobs.estimate_not_approved"]
waiting_days = 3

[intel."jobs.ready_not_collected"]
waiting_days = 5

# --------------------------------------------------------------------------- a believable week (loaded on request)
[sample]
note = "A week at a small garage: a service nobody has collected, a part on order, an estimate waiting for the customer, an insurer repair and a tailoring order."

[[sample.job]]
customer = "Sample: Amina Odhiambo"
item = {label = "Toyota Vitz KDD 214T", kind = "vehicle", odometer = 88200, identifiers = {plate = "KDD 214T"}}
title = "Full service"
type = "service"
fuel = "1/2"
key_tag = "K-07"
days_ago = 8
days_in_stage = 5
stage = "ready"
estimate = "approved"
promised_in_days = -4
labour = [{task = "oil-change", booked = 0.4}, {task = "brake-pads-front", booked = 1.3}]
parts = [{description = "Oil filter", qty = 1, price = 600, class = "genuine"}, {description = "Front brake pads", qty = 1, price = 3800, class = "aftermarket"}]
next_service_in_days = 120
next_service_odometer = 93200

[[sample.job]]

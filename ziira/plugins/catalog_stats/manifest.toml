[unit]
name = "catalog_stats"
title = "Catalog statistics (example plugin)"
kind = "plugin"
version = "1.0.0"
sdk = ">=1.0,<2.0"
requires = ["products"]

[provides]
api_prefix = "/api/v1/plugins/catalog-stats"
subscribes = ["product.created"]

# Sockets of other units this plugin plugs into (code in hooks.py)
[extends]
implements = ["products.sku_suggester"]
validates = ["products.product.before_create"]

[permissions]
"catalog_stats.view" = "View catalog statistics"

[roles]
"Branch Manager" = ["catalog_stats.view"]
"Accountant" = ["catalog_stats.view"]

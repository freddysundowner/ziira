[unit]
name = "ai_anthropic"
title = "AI provider: Anthropic Messages API"
description = "Lets Ziira's AI features write explanations and answer questions using the Anthropic service."
kind = "plugin"
version = "1.0.0"
sdk = ">=1.0,<2.0"
requires = ["intel"]

[provides]
api_prefix = "/api/v1/plugins/ai-anthropic"

# Sockets of other units this plugin plugs into (code in hooks.py)
[extends]
implements = ["intel.llm"]

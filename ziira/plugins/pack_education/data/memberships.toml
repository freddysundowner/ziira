# Fee plans for a term, and bundles of lessons. EVERY FEE BELOW IS AN EXAMPLE: it is marked "example price" until you change it.
# A learner is enrolled on one of the fee plans; the invoices go to the parent or guardian (put the learner and the parent in
# one household, with the parent as payer). Edit, retire or add as you like; nothing here is overwritten once you have changed it.
# Term dates are not stored here: a fee plan has a number of periods, and the learner's enrolment gets the start date and so the
# end date of the term (docs/pack_education.md).

[settings]
grace_days = 0
dunning_days = "7,14,30"      # late-fee messages go this many days after the due date
auto_freeze_days = 0          # 0: never put an enrolment on hold for unpaid fees by itself
inactive_weeks = 0            # no "we miss you" messages
birthday_messages = false
waiver_required = false       # there is no door to open: enrolment terms are accepted on paper or at sign-up
renewal_reminder_days = 14    # reminder to the parent before the next term or instalment
expiry_reminder_days = 14
no_show_consumes = false
late_cancel_consumes = false

[waiver]
title = "Enrolment terms and guardian consent"
body = """EXAMPLE WORDING - replace it with your own terms before you use it.

I am the parent or guardian of the learner named on this enrolment (or I am the learner and an adult). I agree to the fees, the payment dates and the refund and notice rules of the school. I have given the school an emergency contact and the names of the people who may collect the learner. I agree that the school keeps the learner's details, attendance and reports to run its classes, and that it may message me about fees, classes and reports. I understand I can ask to see, correct or erase this information.

(This wording is a placeholder, not legal advice. Have your own terms checked for your country, especially anything about children's data and photographs.)"""


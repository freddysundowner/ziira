[[step]]
id = "prices"
title = "Set your own fees"
hint = "Fees marked as examples are not yours yet: change each class price here and each fee plan in Memberships, Plans and packs."
to = "/services/services"
check = "prices_set"

[[step]]
id = "staff"
title = "Name your teachers and classrooms"
hint = "Replace the example teachers and classrooms with your own, and set their hours."
to = "/services/resources"
check = "staff_named"

[[step]]
id = "link"
title = "Link each class to its service item"
hint = "So fees and lessons can be invoiced."
to = "/services/services"
check = "services_linked"

[[step]]
id = "timetable"
title = "Put your first class in the timetable"
hint = "Choose a class, a day and a time, and repeat it every week of the term."
to = "/services/calendar"
check = "first_booking"

[[step]]
id = "attendance"
title = "Take attendance for your first class"
hint = "Open the class, mark who came and who was absent."
to = "/services/calendar"
check = "first_attendance"

[[step]]
id = "page"
title = "Switch on your booking page (if families book themselves)"
hint = "For trial lessons and make-up sessions."
to = "/services/settings"
check = "booking_page"

[intel."bookings.class_underfilled"]
look_ahead_days = 3
fill_percent = "40.0"
min_capacity = 4
max_sessions = 20

[intel."bookings.class_absences"]
lookback_days = 28
absences = 3
high_count = 6
max_people = 50

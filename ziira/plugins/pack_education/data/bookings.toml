# Classes and teachers for a school, tutoring centre or training centre. Every price is an EXAMPLE until the business sets its
# own. A class is a group session with a roster and a capacity: put the same class in the timetable every week from the Classes
# screen, and book each learner on it.

[settings]
cancel_window_hours = 24          # how late a family can cancel a session without it counting as late
reminder_hours_before = 24
default_buffer_minutes = 10
waitlist_confirm_minutes = 60
late_cancel_fee_percent = 0
no_show_fee_percent = 0
recalls_enabled = false
online_enabled = false            # switch the booking page on when families should book make-ups or trial lessons themselves

[[resource]]
name = "Teacher 1"
kind = "staff"
level = "Senior"
colour = "#2980b9"
order = 1
hours = [{ days = [0, 1, 2, 3, 4], start = "08:00", end = "18:00" }, { days = [5], start = "08:00", end = "13:00" }]


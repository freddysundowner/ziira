# Example data for a salon, spa or barber shop. Every price below is an EXAMPLE: it is marked as one until the business sets its own.
[settings]
cancel_window_hours = 24
reminder_hours_before = 24
default_buffer_minutes = 10
waitlist_confirm_minutes = 30
late_cancel_fee_percent = 50
no_show_fee_percent = 100
rebook_prompt_hours = 3
recalls_enabled = true
patch_test_valid_days = 180
deposit_note = "Send the deposit and quote your name; your time is held once it is paid."


[[step]]
id = "prices"
title = "Set your own prices"
hint = "The prices shown as examples are not yours yet: open Services offered and change each one."
to = "/services/services"
check = "prices_set"

[[step]]
id = "staff"
title = "Name your staff and set their hours"
hint = "Replace Stylist 1, Stylist 2 and the chairs with your own people and working hours."
to = "/services/resources"
check = "staff_named"

[[step]]
id = "link"
title = "Link each service to its service item"
hint = "So a finished visit can be billed: pick the service item for each service."
to = "/services/services"
check = "services_linked"

[[step]]
id = "fees"
title = "Choose the item for late-cancel and no-show fees"
hint = "Pick a service item in Booking settings, or set the fee percents to 0."
to = "/services/settings"
check = "fee_item"

[[step]]
id = "page"
title = "Switch on your booking page"
hint = "Choose an address and let clients book themselves."
to = "/services/settings"
check = "booking_page"

[[step]]
id = "booking"
title = "Take your first booking"
hint = "Put an appointment in the calendar."
to = "/services/calendar"
check = "first_booking"

[[step]]
id = "checkout"
title = "Check out your first client"
hint = "Bill a visit with a tip and a product."
to = "/services/front-desk"
check = "first_checkout"

[intel."bookings.no_show_rate"]
lookback_days = 30
min_appointments = 8
no_show_percent = "15.0"

[intel."bookings.late_cancellations"]
lookback_days = 30
late_cancel_count = 4

[intel."bookings.low_utilisation"]
lookback_days = 14
utilisation_percent = "40.0"
min_hours = 12

[intel."bookings.idle_gaps"]
look_ahead_days = 2
gap_minutes = 90

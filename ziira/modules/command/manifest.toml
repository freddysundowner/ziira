[unit]
name = "command"
title = "Command Center"
kind = "module"
version = "1.0.0"
sdk = ">=1.0,<2.0"
requires = []
optional = ["intel"]

[provides]
api_prefix = "/api/v1/command"
publishes = []
extension_points = ["command.pulse_source"]
subscribes = []

[permissions]
"command.view" = "View the Command Center"
"briefs.manage" = "Manage brief schedules and collect figures now"

# Default roles that receive these permissions when the module is enabled (Owner gets all).
[roles]
"Finance Manager" = ["command.view"]
"Branch Manager" = ["command.view"]
"Accountant" = ["command.view"]

[unit]
name = "people"
title = "People, HR and Payroll"
kind = "module"
version = "1.0.0"
sdk = ">=1.0,<2.0"
requires = []
optional = ["finance", "payments", "pos", "intel", "command", "imports"]

[provides]
api_prefix = "/api/v1/people"
publishes = ["employee.pay_changed", "employee.bank_changed", "payroll.approved", "payroll.paid"]
subscribes = ["till.opened", "till.closed"]

[extends]
implements = ["intel.check", "intel.baseline_metric", "command.pulse_source", "imports.importer", "kernel.personal_data", "intel.ask_tool"]

[permissions]
"employees.view" = "View employees"
"employees.manage" = "Manage employees"
"employee.pay_edit" = "Change pay and bank details"
"attendance.manage" = "Manage attendance"
"leave.approve" = "Approve leave"
"payroll.prepare" = "Prepare payroll"
"payroll.approve" = "Approve payroll"
"payroll.view" = "See payroll runs and payslips"
"payroll.pay" = "Pay salaries and download payment files"
"payroll.rates" = "Manage and verify statutory rate tables"

# Default roles that receive these permissions when the module is enabled (Owner gets all).
[roles]
"HR" = ["employees.view", "employees.manage", "attendance.manage", "leave.approve", "employee.pay_edit"]
"Finance Manager" = ["employees.view", "employee.pay_edit", "payroll.prepare", "payroll.view", "payroll.pay", "payroll.rates"]
"Accountant" = ["employees.view", "payroll.view", "payroll.rates"]
"Branch Manager" = ["employees.view", "attendance.manage", "leave.approve"]

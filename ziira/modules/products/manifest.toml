[unit]
name = "products"
title = "Products and Pricing"
kind = "module"
version = "1.0.0"
sdk = ">=1.0,<2.0"
requires = []
optional = ["inventory"]

[provides]
api_prefix = "/api/v1/products"
publishes = ["product.created", "price.changed"]
subscribes = []
# Sockets other units can plug into (contracts in public.py, declared in hooks.py)
extension_points = ["products.sku_suggester"]
validation_hooks = ["products.product.before_create"]

[permissions]
"products.view" = "View products and prices"
"products.manage" = "Create and edit products"
"prices.manage" = "Change prices"

# Default roles that receive these permissions when the module is enabled (Owner gets all).
[roles]
"Finance Manager" = ["products.view", "prices.manage"]
"Branch Manager" = ["products.view", "products.manage"]
"Cashier" = ["products.view"]
"Storekeeper" = ["products.view"]
"Sales Rep" = ["products.view"]
"Accountant" = ["products.view"]

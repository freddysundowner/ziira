[unit]
name = "finance"
title = "Finance and Accounting"
kind = "module"
version = "1.0.0"
sdk = ">=1.0,<2.0"
requires = []
optional = ["pos", "payments", "purchasing", "inventory", "people"]

[provides]
api_prefix = "/api/v1/finance"
publishes = ["journal.posted", "period.closed", "expense.approved"]
subscribes = ["stock.moved", "sale.posted", "sale.returned", "payment.settled", "payment.banked", "till.closed", "approval.decided"]

# Sockets of other units this module plugs into (code in hooks.py)
[extends]
implements = ["kernel.integrity_check"]

[permissions]
"accounts.manage" = "Manage chart of accounts"
"journal.post_manual" = "Post manual journals"
"journal.approve" = "Approve manual journals"
"expenses.submit" = "Submit expenses"
"expenses.approve" = "Approve expenses"
"period.close" = "Close accounting periods"
"reports.view" = "View financial reports"

# Default roles that receive these permissions when the module is enabled (Owner gets all).
[roles]
"Finance Manager" = ["accounts.manage", "journal.post_manual", "journal.approve", "period.close", "reports.view"]
"Accountant" = ["accounts.manage", "journal.post_manual", "reports.view"]
"Branch Manager" = ["reports.view"]

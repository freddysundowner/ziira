[unit]
name = "finance"
title = "Finance and Accounting"
description = "Books of account: journal, ledgers, expenses, bank reconciliation and financial reports."
kind = "module"
version = "1.0.0"
sdk = ">=1.0,<2.0"
requires = []
optional = ["pos", "crm", "payments", "purchasing", "inventory", "people", "intel", "command", "imports"]

[provides]
api_prefix = "/api/v1/finance"
publishes = ["journal.posted", "period.closed", "expense.approved", "reconciliation.completed"]
subscribes = ["stock.moved", "sale.posted", "sale.returned", "payment.settled", "payment.banked", "till.closed", "bill.posted", "bill.reversed", "supplier.paid", "supplier.payment_reversed", "supplier.refunded", "supplier.refund_reversed", "credit_note.posted", "payroll.approved", "payroll.paid", "customer.paid", "customer.payment_reversed", "customer.advance_refunded", "customer.refund_reversed", "customer.opening_balance", "customer.opening_balance_reversed", "supplier.opening_balance", "supplier.opening_balance_reversed", "approval.decided"]

# Sockets of other units this module plugs into (code in hooks.py)
[extends]
implements = ["kernel.branch_usage", "kernel.integrity_check", "intel.check", "intel.baseline_metric", "intel.action", "command.pulse_source", "imports.importer", "intel.ask_tool"]

[permissions]
"accounts.manage" = "Manage chart of accounts"
"journal.post_manual" = "Post manual journals"
"journal.approve" = "Approve manual journals"
"expenses.submit" = "Submit expenses"
"expenses.approve" = "Approve expenses"
"period.close" = "Close accounting periods"
"reports.view" = "View financial reports"
"bank.reconcile" = "Reconcile bank, M-Pesa and card accounts to their statements"

# Default roles that receive these permissions when the module is enabled (Owner gets all).
[roles]
"Finance Manager" = ["accounts.manage", "journal.post_manual", "journal.approve", "period.close", "reports.view", "expenses.submit", "expenses.approve", "bank.reconcile"]
"Accountant" = ["accounts.manage", "journal.post_manual", "reports.view", "expenses.submit", "bank.reconcile"]
"Branch Manager" = ["reports.view", "expenses.submit"]

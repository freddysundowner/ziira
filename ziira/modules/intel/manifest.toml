[unit]
name = "intel"
title = "Ziira Intelligence store"
description = "Checks your business data every day and tells the owner what needs attention."
category = "intelligence"
kind = "module"
version = "1.0.0"
sdk = ">=1.0,<2.0"
requires = []
optional = []

[provides]
api_prefix = "/api/v1/intel"
publishes = ["finding.created", "finding.asked"]
extension_points = ["intel.check", "intel.baseline_metric", "intel.llm", "intel.ask_tool", "intel.action"]
subscribes = []

# Sockets of other units this module plugs into (code in hooks.py)
[extends]
implements = ["intel.check", "intel.llm", "intel.ask_tool", "intel.action", "kernel.personal_data", "kernel.inbound_command", "kernel.ai_platform", "kernel.site_assistant_llm"]

[permissions]
"findings.view" = "View findings"
"findings.manage" = "Acknowledge, resolve, dismiss and assign findings; tune the checks; ask people to explain"
"findings.respond" = "Explain the findings assigned to you"
"ai.manage" = "Switch the AI assistant on or off for the business, set its budget, and read its usage, call log and conversations"
"ai.ask" = "Ask Ziira questions about the business, within your own access"
"intel.automation" = "Let Intelligence prepare drafts and carry out routine actions: raise its action level to 3 or 4 (Owner only)"

# Default roles that receive these permissions when the module is enabled (Owner gets all).
[roles]
"Finance Manager" = ["findings.view", "findings.manage", "ai.ask"]
"Accountant" = ["findings.view", "ai.ask"]
"Branch Manager" = ["findings.view", "findings.respond", "ai.ask"]

# Events a business may subscribe to with an outgoing webhook (docs/webhooks.md): only these fields leave the system.
[provides.public_events."finding.created"]
description = "Ziira Intelligence found something that needs attention"
fields = ["check", "severity", "company_id", "branch_id", "amount"]

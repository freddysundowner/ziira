[unit]
name = "payments"
title = "Payments and Reconciliation"
description = "Take cash, card, bank and mobile-money payments and match them to sales and bank statements."
category = "payments"
kind = "module"
version = "1.0.0"
sdk = ">=1.0,<2.0"
requires = []
optional = ["pos", "crm", "finance", "intel", "command", "connect"]

[provides]
api_prefix = "/api/v1/payments"
publishes = ["payment.received", "payment.made", "payment.reversed", "payment.matched", "payment.unmatched", "payment.settled", "payment.banked", "stk.completed", "close.completed", "close.variance"]
subscribes = ["approval.decided"]
extension_points = ["payments.provider", "payments.statement_format"]

# Sockets of other units this module plugs into (code in hooks.py)
[extends]
implements = ["intel.check", "intel.baseline_metric", "command.pulse_source", "kernel.personal_data", "connect.core_coverage"]

[permissions]
"payments.view" = "View payments"
"payments.record" = "Record payments"
"recon.match" = "Match transactions manually"
"close.submit" = "Submit daily close"
"close.reopen" = "Reopen a locked day"
"payments.manage" = "Manage payment accounts and provider credentials"
"payments.collect" = "Ask customers to pay by mobile money"

# Default roles that receive these permissions when the module is enabled (Owner gets all).
[roles]
"Finance Manager" = ["payments.view", "payments.record", "recon.match", "close.submit", "close.reopen", "payments.manage", "payments.collect"]
"Accountant" = ["payments.view", "payments.record", "recon.match"]
"Branch Manager" = ["payments.view", "payments.record", "recon.match", "close.submit", "payments.collect"]
"Cashier" = ["payments.view", "payments.collect"]

# Events a business may subscribe to with an outgoing webhook (docs/webhooks.md): only these fields leave the system.
[provides.public_events."payment.received"]
description = "A payment from a customer or other payer was recorded"
fields = ["company_id", "branch_id", "number", "method", "amount", "business_date", "party_type", "party_id", "payment_account_id"]

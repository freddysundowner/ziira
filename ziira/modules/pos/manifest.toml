[unit]
name = "pos"
title = "Point of Sale and Sales"
kind = "module"
version = "1.0.0"
sdk = ">=1.0,<2.0"
requires = ["products", "inventory", "payments"]
optional = ["crm", "finance", "intel", "command"]

[provides]
api_prefix = "/api/v1/pos"
publishes = ["sale.posted", "sale.voided", "sale.returned", "discount.override", "till.opened", "till.closed", "invoice.issued", "invoice.cancelled", "pos.synced", "customer.paid", "customer.payment_reversed", "customer.over_limit_attempt", "customer.advance_refunded", "customer.refund_reversed", "customer.credit_applied"]
subscribes = ["approval.decided", "payment.reversed"]
extension_points = ["pos.receipt_extras"]

# Sockets of other units this module plugs into (code in hooks.py)
[extends]
implements = ["kernel.integrity_check", "intel.check", "intel.baseline_metric", "command.pulse_source", "kernel.personal_data"]

[permissions]
"sales.sell" = "Make sales"
"sales.void" = "Void sales"
"sales.refund" = "Process returns"
"price.override" = "Override prices and discounts"
"invoices.manage" = "Issue invoices"
"till.manage" = "Open and close your own till"
"till.review" = "See and close any till at a branch"
"devices.manage" = "Register and block POS devices"
"receivables.view" = "See what customers owe: invoices, statements and ageing"
"receivables.manage" = "Record payments from customers"

# Default roles that receive these permissions when the module is enabled (Owner gets all).
[roles]
"Branch Manager" = ["sales.sell", "sales.void", "sales.refund", "price.override", "invoices.manage", "till.manage", "till.review", "devices.manage", "receivables.view", "receivables.manage"]
"Finance Manager" = ["till.review", "invoices.manage", "receivables.view", "receivables.manage"]
"Accountant" = ["till.review", "receivables.view", "receivables.manage"]
"Cashier" = ["sales.sell", "till.manage", "receivables.manage"]
"Sales Rep" = ["sales.sell", "invoices.manage", "receivables.view"]

# Reason codes seeded for the tenant when the module is enabled; tenants can add their own.
[reason_codes.void]
WRONG_ITEM = "Wrong item rung up"
CUSTOMER_LEFT = "Customer changed their mind"
CASHIER_ERROR = "Cashier error"

[reason_codes.sale_return]
FAULTY = "Faulty goods"
WRONG_ITEM = "Wrong item supplied"
NOT_WANTED = "Customer changed their mind"

[reason_codes.price_override]
MANAGER_APPROVED = "Manager approved price"
DAMAGED = "Damaged or shop-soiled"
BULK = "Bulk or regular customer discount"
MATCH_COMPETITOR = "Matching a competitor's price"

[reason_codes.till_variance]
CHANGE_ERROR = "Change given incorrectly"
UNRECORDED_SALE = "Sale not recorded"
UNRECORDED_PAYOUT = "Cash paid out and not recorded"
UNKNOWN = "Not yet explained"

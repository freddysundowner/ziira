[unit]
name = "inventory"
title = "Inventory and Branches"
description = "Stock by location and batch, receiving, transfers, counts and adjustments, with a full movement history."
category = "stock"
kind = "module"
version = "1.0.0"
sdk = ">=1.0,<2.0"
requires = ["products"]
optional = ["purchasing", "pos", "intel", "command", "imports", "connect"]

[provides]
api_prefix = "/api/v1/inventory"
publishes = ["stock.moved", "stock.negative", "stock.adjusted", "transfer.dispatched", "transfer.received", "count.posted", "stock.below_reorder"]
subscribes = ["approval.decided", "sale.posted", "sale.returned", "goods.received", "goods.returned"]

# Sockets of other units this module plugs into (code in hooks.py)
[extends]
implements = ["kernel.branch_usage", "kernel.integrity_check", "intel.check", "intel.baseline_metric", "command.pulse_source", "imports.importer", "intel.ask_tool", "connect.core_coverage", "kernel.country_seeder"]

[permissions]
"stock.view" = "View stock"
"stock.adjust" = "Create stock adjustments"
"stock.transfer" = "Transfer stock"
"stock.count" = "Run stock counts"
"stock.approve" = "Approve adjustments and count variances"
"stock.cost" = "See what stock cost and what it is worth"
"locations.manage" = "Create and change stock locations"

# Default roles that receive these permissions when the module is enabled (Owner gets all).
[roles]
"Branch Manager" = ["stock.view", "stock.adjust", "stock.transfer", "stock.count", "stock.approve", "stock.cost", "locations.manage"]
"Finance Manager" = ["stock.view", "stock.cost"]
"Storekeeper" = ["stock.view", "stock.adjust", "stock.transfer", "stock.count"]
"Cashier" = ["stock.view"]
"Sales Rep" = ["stock.view"]
"Accountant" = ["stock.view", "stock.cost"]

# Reason codes seeded for the tenant when the module is enabled; tenants can add their own.
[reason_codes.stock_adjustment]
DAMAGED = "Damaged"
EXPIRED = "Expired"
THEFT = "Theft or loss"
FOUND = "Found stock"
DATA_ERROR = "Correction of a data entry error"

[reason_codes.write_off]
DAMAGED = "Damaged beyond sale"
EXPIRED = "Expired"

[reason_codes.transfer_variance]
SHORT_SHIPPED = "Sent less than recorded"
DAMAGED_IN_TRANSIT = "Damaged in transit"

[reason_codes.count_variance]
COUNT_ERROR = "Earlier count was wrong"
UNRECORDED_SALE = "Sale not recorded"
THEFT = "Theft or loss"

# Events a business may subscribe to with an outgoing webhook (docs/webhooks.md): only these fields leave the system.
[provides.public_events."stock.below_reorder"]
description = "A product fell below its reorder level"
fields = ["company_id", "product_id", "sku", "quantity", "reorder_level"]

[unit]
name = "kernel"
title = "Kernel"
kind = "module"
core = true
version = "1.0.0"

[provides]
publishes = ["approval.decided", "exception.raised"]
extension_points = ["kernel.integrity_check", "kernel.notification_channel", "kernel.personal_data"]

[extends]
implements = ["kernel.personal_data"]

[permissions]
"users.manage" = "Create users and assign roles"
"roles.manage" = "Create and edit roles"
"units.manage" = "Enable and disable modules and plugins"
"audit.view" = "View the audit trail"
"approvals.decide" = "Approve or reject requests"
"approvals.manage" = "Set up the approval matrix"
"settings.manage" = "Manage document numbering and reason codes"
"api_keys.manage" = "Create and revoke API keys for integrations"
"exceptions.manage" = "Work the exceptions inbox: assign, explain and resolve items"
"privacy.manage" = "Handle data subject requests: find, export and erase a person's data"

# Owner receives every permission automatically.
[roles]
"Finance Manager" = ["approvals.decide", "audit.view", "exceptions.manage"]
"Branch Manager" = ["approvals.decide", "exceptions.manage"]
"Accountant" = ["audit.view"]

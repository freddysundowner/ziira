# Local development services. Production hosting is configured separately.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ziira          # owner: migrations and admin commands
      POSTGRES_PASSWORD: ziira
      POSTGRES_DB: ziira_master   # master database; tenant databases are created per tenant
    ports:
      - "${ZIIRA_DB_PORT:-5432}:5432"   # set ZIIRA_DB_PORT=5433 if another PostgreSQL uses 5432
    volumes:
      - ziira_db:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ziira"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7
    ports:
      - "6379:6379"
volumes:
  ziira_db:

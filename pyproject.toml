[project]
name = "ziira-core"
version = "1.0.0.dev0"
description = "Ziira Core: modular ERP kernel, modules and plugins"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "cryptography>=42",       # encrypts tenant database credentials in the master database
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10", "import-linter>=2.0"]

[project.scripts]
ziira = "ziira.kernel.cli:main"

# Third-party plugins register themselves here (see docs/plugins.md)
[project.entry-points."ziira.units"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ziira*"]

[tool.setuptools.package-data]
"*" = ["*.toml", "*.sql", "*.md"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["N818"]  # error names like NotFound read better without an Error suffix
# FastAPI declares dependencies with Depends()/Header() in argument defaults.

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "ziira"]

# Module boundaries: a unit may import only the sdk, its own package
# and other units' public.py. Run with: lint-imports
[tool.importlinter]
root_package = "ziira"

[[tool.importlinter.contracts]]
name = "Modules use only the sdk, not kernel internals"
type = "forbidden"
source_modules = ["ziira.modules", "ziira.plugins"]
forbidden_modules = ["ziira.kernel"]
allow_indirect_imports = true  # going through ziira.sdk is the intended path

# Cross-module rule (only public.py may be imported) is checked by tests/test_architecture.py

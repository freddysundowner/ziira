# Lint and test every push and pull request: the backend against PostgreSQL 16, then the web app.
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: ziira
          POSTGRES_PASSWORD: ziira
          POSTGRES_DB: ziira
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ziira" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ZIIRA_TEST_ADMIN_URL: postgresql+psycopg://ziira:ziira@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -U pip
          .venv/bin/pip install -e ".[dev]"
      - name: PostgreSQL client tools (backup and restore tests need pg_dump/pg_restore of the server's version)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16
          pg_dump --version
      - name: Lint (ruff, mypy, import-linter)
        run: make lint
      - name: Test
        run: .venv/bin/pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -U pip
          .venv/bin/pip install -e ".[dev]"
          npm --prefix frontend ci
      - name: API types match the backend
        run: |
          make api-types
          git diff --exit-code frontend/src/api/schema.d.ts || \
            (echo "frontend/src/api/schema.d.ts is out of date: run 'make api-types' and commit it"; exit 1)
      - name: Lint, types, tests, build
        run: make web-check

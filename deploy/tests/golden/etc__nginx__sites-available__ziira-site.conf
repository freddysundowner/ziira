server {
    listen 80;
    listen [::]:80;
    server_name ziira.io www.ziira.io;
    access_log /var/log/nginx/ziira/site.access.log ziira;
    error_log /var/log/nginx/ziira/site.error.log warn;
    include snippets/ziira-acme.conf;
    location / { return 301 https://ziira.io$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.ziira.io;
    ssl_certificate /etc/letsencrypt/live/ziira.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ziira.io/privkey.pem;
    include snippets/ziira-tls.conf;
    access_log /var/log/nginx/ziira/site.access.log ziira;
    error_log /var/log/nginx/ziira/site.error.log warn;
    return 301 https://ziira.io$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ziira.io;
    ssl_certificate /etc/letsencrypt/live/ziira.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ziira.io/privkey.pem;
    include snippets/ziira-tls.conf;
    access_log /var/log/nginx/ziira/site.access.log ziira;
    error_log /var/log/nginx/ziira/site.error.log warn;

    root /var/www/ziira/site/current;
    index index.html;
    error_page 404 /404.html;

    include snippets/ziira-headers-site.conf;

    # 301 map from site/redirects.json (rewritten by the site build; nginx reloads itself when it changes).
    include /var/lib/ziira/nginx/site-redirects.conf;

    location = /404.html { internal; include snippets/ziira-headers-site.conf; }
    # Netlify-style files that only mean something to a static host.
    location ~ ^/(_headers|_redirects)$ { return 404; }
    location ~ /\.(?!well-known) { return 404; }

    location ^~ /_astro/ { add_header Cache-Control "public, max-age=31536000, immutable" always; include snippets/ziira-headers-site.conf; try_files $uri =404; }
    location ^~ /fonts/ { add_header Cache-Control "public, max-age=2592000" always; include snippets/ziira-headers-site.conf; try_files $uri =404; }
    location ^~ /og/ { add_header Cache-Control "public, max-age=86400" always; include snippets/ziira-headers-site.conf; try_files $uri =404; }
    location ^~ /media/ { add_header Cache-Control "public, max-age=86400" always; include snippets/ziira-headers-site.conf; try_files $uri =404; }
    location = /sitemap.xml { add_header Cache-Control "public, max-age=3600" always; include snippets/ziira-headers-site.conf; }

    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        include snippets/ziira-headers-site.conf;
        try_files $uri $uri/ =404;
    }
}

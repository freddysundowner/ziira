# Headers for requests handed to the API. X-Forwarded-For is OVERWRITTEN with the connecting address (the API is
# started with ZIIRA_TRUST_FORWARDED_FOR=true and reads the last entry), so a client cannot forge its address.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Request-ID $request_id;
proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;
proxy_redirect off;

# Managed by the Ziira installer. Our own nginx, listening on 127.0.0.1 only; another proxy fronts it.
user ziira;
worker_processes 2;
pid /run/ziira-nginx.pid;
error_log /var/log/ziira/nginx/main.error.log warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    access_log off;
    client_body_temp_path /var/lib/ziira/nginx-tmp/body;
    proxy_temp_path /var/lib/ziira/nginx-tmp/proxy;
    fastcgi_temp_path /var/lib/ziira/nginx-tmp/fastcgi;
    uwsgi_temp_path /var/lib/ziira/nginx-tmp/uwsgi;
    scgi_temp_path /var/lib/ziira/nginx-tmp/scgi;
    include conf.d/ziira-common.conf;
    include sites/ziira-*.conf;
}

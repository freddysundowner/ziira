server {
    listen 80;
    listen [::]:80;
    server_name app.ziira.io;
    access_log /var/log/ziira/nginx/app.access.log ziira;
    error_log /var/log/ziira/nginx/app.error.log warn;
    include snippets/ziira-server.conf;
    include snippets/ziira-acme.conf;
    location / { default_type text/plain; return 503 "This server is being set up. Try again in a few minutes."; }
}

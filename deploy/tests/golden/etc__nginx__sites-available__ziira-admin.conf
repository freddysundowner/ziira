server {
    listen 80;
    listen [::]:80;
    server_name admin.ziira.io;
    access_log /var/log/ziira/nginx/admin.access.log ziira;
    error_log /var/log/ziira/nginx/admin.error.log warn;
    include snippets/ziira-server.conf;
    include snippets/ziira-acme.conf;
    location / { return 301 https://admin.ziira.io$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.ziira.io;
    ssl_certificate /etc/letsencrypt/live/ziira-admin.ziira.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ziira-admin.ziira.io/privkey.pem;
    include snippets/ziira-tls.conf;
    access_log /var/log/ziira/nginx/admin.access.log ziira;
    error_log /var/log/ziira/nginx/admin.error.log warn;
    include snippets/ziira-server.conf;

    root /var/www/ziira/app/current;
    index index.html;
    client_max_body_size 2m;

    include snippets/ziira-headers-admin.conf;

    # The Super Admin's "Publish website" calls this (signed with ZIIRA_SITE_BUILD_HOOK_SECRET); it only starts a build.
    # Not network-restricted: the API calls it from this server's own public address. The signature is what protects it.
    location = /_hooks/site-rebuild/TOKEN123 {
        limit_req zone=ziira_hook burst=3 nodelay;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:9001/rebuild;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 15s;
    }

    location = /robots.txt { default_type text/plain; return 200 "User-agent: *\nDisallow: /\n"; }

    location = / { include snippets/ziira-admin-allow.conf; return 302 /operator; }

    # The Super Admin screens (the same web app build; only the staff routes are reachable on this host).
    location ~ ^/operator(/|$) {
        include snippets/ziira-admin-allow.conf;
        add_header Cache-Control "no-cache" always;
        include snippets/ziira-headers-admin.conf;
        try_files /index.html =404;
    }
    location ^~ /assets/ { include snippets/ziira-admin-allow.conf; add_header Cache-Control "public, max-age=31536000, immutable" always; include snippets/ziira-headers-admin.conf; try_files $uri =404; }

    # Staff API, public plans/site content, edition list. Everything else is not served on this host.
    location /api/v1/operator {
        include snippets/ziira-admin-allow.conf;
        limit_req zone=ziira_api burst=100 nodelay;
        include snippets/ziira-proxy.conf;
        proxy_pass http://ziira_api;
    }
    location ~ ^/api/v1/operator/(sign-in|mfa/verify|password)$ {
        include snippets/ziira-admin-allow.conf;
        limit_req zone=ziira_operator_auth burst=5 nodelay;
        include snippets/ziira-proxy.conf;
        proxy_pass http://ziira_api;
    }
    location ^~ /api/v1/public/ {
        include snippets/ziira-admin-allow.conf;
        limit_req zone=ziira_api burst=100 nodelay;
        include snippets/ziira-proxy.conf;
        proxy_pass http://ziira_api;
    }
    location = /api/v1/editions {
        include snippets/ziira-admin-allow.conf;
        limit_req zone=ziira_api burst=100 nodelay;
        include snippets/ziira-proxy.conf;
        proxy_pass http://ziira_api;
    }

    location / { return 404; }
}
